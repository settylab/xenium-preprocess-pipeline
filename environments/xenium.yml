name: xenium
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Python — the union of the three package environment specs
  # (packages/xenium-preprocess, packages/ref-build, packages/rctd-split)
  # so one env installs and drives the whole chain.
  #
  # Round-2 rewrite (2026-08-13): rebuilt from the Setty Lab operator's
  # WORKING `xenium` micromamba env as ground truth. Every conda-side
  # dep below is present + solved in that env
  # (`micromamba env export -n xenium`). Two changes from round-1:
  #
  # 1. `leidenalg` + `python-igraph` moved to the `pip:` sub-section,
  #    matching the operator's actual working state (both are
  #    pip-installed there, not conda). The conda-forge recipe drags
  #    in an older `libleidenalg`/`glpk`/`c-ares` chain that has been
  #    fighting the solver against current repodata; the PyPI wheels
  #    resolve independently and cover Linux x86_64 out of the box.
  # 2. `python=3.11` → `python=3.13` to match the operator's env.
  #    The three `packages/*/pyproject.toml` set `requires-python =
  #    ">=3.10"` (classifiers are informational only), so 3.13 is
  #    supported.
  #
  # Conda-side pins stay LOOSE. The three `packages/*/pyproject.toml`
  # pin `anndata==0.11.*` and `scanpy==1.11.*` on the pip side, so
  # `uv pip install -e ...` after the conda solve is what actually
  # locks those versions. Over-pinning here just makes the libmamba
  # solve fail against current conda-forge repodata.
  #
  # `hdf5` is DELIBERATELY UNPINNED — it comes in transitively via
  # `h5py` (a scanpy/anndata dep) and pinning it triggered a
  # `pytables 3.10.x → hdf5 >=1.14.4,<1.14.5.0a0` collapse in round-1.
  - python=3.13
  - pip
  - numpy
  - scipy
  - pandas
  - pyarrow>=18       # floor keeps the solver out of the pyarrow 8–11
                      # arrow-cpp/c-ares<1.19 dead zone.
  - pyyaml
  - matplotlib
  - seaborn
  - anndata           # pyproject.toml pip-pins to 0.11.* on top.
  - zarr<3            # anndata 0.11.* does not support zarr>=3
                      # (ImportError: "zarr-python major version > 2
                      # is not supported"). Pin until the pyproject
                      # anndata bound moves to 0.12+.
  - scanpy            # pyproject.toml pip-pins to 1.11.* on top.
  - umap-learn
  - pip:
      # PyPI wheels for the graph-clustering stack. Kept out of conda
      # so the solver doesn't have to reconcile libleidenalg / glpk /
      # c-ares versions against the pyarrow + arrow-cpp stack.
      - leidenalg
      - igraph        # `import igraph`; PyPI project name is `igraph`.
  # R (Seurat, Matrix, spacexr, SPLIT) lives outside conda by default —
  # each Slurm submit template `module load`s fhR/4.4.1-foss-2023b on
  # the Cluster cluster, and `spacexr` + `SPLIT` install into a user
  # R library (see environments/README.md and docs/installation.md).
  #
  # For an off-cluster conda-native R install, uncomment the block
  # below (heavy solve; ~30–60 min):
  #
  # - r-base=4.4
  # - r-seurat
  # - r-matrix
  # - r-readr
  # - bioconductor-spatialexperiment
