name: exploration
channels:
  - conda-forge
  - bioconda
dependencies:
  # Standalone env for the exploration package. Zero overlap with the R
  # side of xenium-preprocess — this is Python-only downstream analysis.
  # Pinning matches xenium-preprocess so a shared env can host both.
  - python=3.11
  - numpy
  - scipy
  - pandas
  - anndata=0.11
  - zarr<3            # anndata 0.11.* rejects zarr>=3 at import time.
  - shapely           # annotate: polygon construction + signed distance (Tracy #31)
  - pip
