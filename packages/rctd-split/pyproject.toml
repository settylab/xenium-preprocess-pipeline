[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rctd-split"
version = "0.2.6"
description = "RCTD + SPLIT typing (Stage D) with mtx exports + h5ad conversion."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "xenium-preprocess-pipeline contributors" },
]
keywords = ["xenium", "spatial-transcriptomics", "RCTD", "SPLIT", "spacexr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Same pinning discipline as xenium-preprocess and ref-build: only the
# Python side is expressed here; the R side (Seurat, spacexr, SPLIT)
# lives in `environment.yml` and is installed via the LMOD R module +
# a user-local R lib (see docs/install.md).
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "anndata==0.11.*",
    "scanpy==1.11.*",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rctd-split = "rctd_split.cli:main"

[project.urls]
Homepage = "https://example.org/rctd-split"
Issues = "https://example.org/rctd-split/issues"

[tool.setuptools.package-data]
rctd_split = ["r/*.R", "../../config/default.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
